spring.application.name=Springboot-API-REST
# CAMBIO CRÍTICO: Cambiado a 8080 para que coincida con tu deployment de Kubernetes
server.port=8080
spring.web.allow-cors=true

# Configuración de la base de datos MySQL en Kubernetes
# CAMBIO: Ajustado para usar las variables que inyectamos desde deployment.yaml
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/innovatech_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.platform=mysql

# Configuración de Hibernate
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html